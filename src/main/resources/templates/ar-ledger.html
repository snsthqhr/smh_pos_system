<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼화페인트 거래처 매출원장</title>
    <link rel="stylesheet" href="/css/app-ui.css?v=20260903-return-amount">
</head>
<body class="app-shell management-screen">
<aside class="management-nav">
    <div class="brand-mark vertical">
        <strong>SP SAMHWA</strong>
        <span>거래처 원장</span>
    </div>
    <nav aria-label="관리 메뉴">
        <a href="/sales-management">판매내역 관리</a>
        <a href="/ar-management">거래처 미수현황</a>
        <a href="#">거래처 매출현황</a>
        <a class="is-active" href="/ar-ledger">거래처 매출원장</a>
        <a href="#">거래명세표 출력</a>
        <a href="/ar-management">미수금 관리</a>
        <a href="#">고객 관리</a>
        <a href="#">상품 관리</a>
        <a href="/pos">POS 판매 화면</a>
    </nav>
</aside>

<main class="management-layout ledger-layout">
    <header class="management-header">
        <div>
            <p>AR03. 거래처 매출원장</p>
            <h1>거래처 매출원장</h1>
        </div>
        <div class="header-actions">
            <button type="button" data-export-ledger-word>워드 추출</button>
            <button type="button" data-export-ledger-hwp>한글 추출</button>
            <a href="/ar-management">미수금 관리</a>
            <a href="/sales-management">판매내역</a>
            <a href="/pos">POS 판매</a>
        </div>
    </header>

    <section class="ledger-search-band" aria-label="거래처 원장 검색">
        <label class="management-customer-search">
            고객명
            <input type="search" data-ledger-customer-search autocomplete="off" placeholder="비워두면 전체 고객">
            <button type="button" class="customer-clear" data-ledger-customer-clear hidden>해제</button>
            <div class="customer-results management-customer-results" data-ledger-customer-results hidden></div>
        </label>
        <label>
            시작일
            <input type="date" data-ledger-start-date>
        </label>
        <label>
            종료일
            <input type="date" data-ledger-end-date>
        </label>
        <button type="button" data-search-ledger>조회</button>
        <button type="button" class="small-action" data-toggle-ledger-detail>조건 상세 조회</button>
        <p class="management-message" data-ledger-message></p>
    </section>

    <section class="ledger-detail-options" data-ledger-detail-options hidden aria-label="거래처 원장 상세 조건">
        <div>
            <strong>거래 구분</strong>
            <label><input type="checkbox" data-ledger-type-filter value="판매(외상)" checked> 외상판매</label>
            <label><input type="checkbox" data-ledger-type-filter value="판매(즉시결제)" checked> 즉시결제</label>
            <label><input type="checkbox" data-ledger-type-filter value="수금" checked> 수금</label>
            <label><input type="checkbox" data-ledger-type-filter value="반품" checked> 반품</label>
            <label><input type="checkbox" data-ledger-type-filter value="환불정산" checked> 환불정산</label>
            <label><input type="checkbox" data-ledger-type-filter value="오더합계"> 오더합계</label>
        </div>
        <div>
            <strong>표시 항목</strong>
            <label><input type="checkbox" data-ledger-column-filter value="date" checked> 일자</label>
            <label><input type="checkbox" data-ledger-column-filter value="customer" checked> 고객명</label>
            <label><input type="checkbox" data-ledger-column-filter value="type" checked> 구분</label>
            <label><input type="checkbox" data-ledger-column-filter value="order" checked> 전표</label>
            <label><input type="checkbox" data-ledger-column-filter value="product" checked> 품명/내용</label>
            <label><input type="checkbox" data-ledger-column-filter value="quantity" checked> 수량</label>
            <label><input type="checkbox" data-ledger-column-filter value="unitPrice" checked> 단가</label>
            <label><input type="checkbox" data-ledger-column-filter value="sale" checked> 판매금액</label>
            <label><input type="checkbox" data-ledger-column-filter value="payment" checked> 수금액</label>
            <label><input type="checkbox" data-ledger-column-filter value="return" checked> 반품금액</label>
            <label><input type="checkbox" data-ledger-column-filter value="delta" checked> 미수증감</label>
            <label><input type="checkbox" data-ledger-column-filter value="balance" checked> 잔액</label>
            <label><input type="checkbox" data-ledger-column-filter value="memo" checked> 메모</label>
        </div>
    </section>

    <section class="ledger-table" aria-label="거래처 원장">
        <div class="table-header">
            <span data-col="date">일자</span>
            <span data-col="customer">고객명</span>
            <span data-col="type">구분</span>
            <span data-col="order">전표</span>
            <span data-col="product">품명/내용</span>
            <span data-col="quantity">수량</span>
            <span data-col="unitPrice">단가</span>
            <span data-col="sale">판매금액</span>
            <span data-col="payment">수금액</span>
            <span data-col="return">반품금액</span>
            <span data-col="delta">미수증감</span>
            <span data-col="balance">잔액</span>
            <span data-col="memo">메모</span>
        </div>
        <div class="ledger-rows" data-ledger-rows>
            <div class="empty-table-state">조회 조건을 입력하고 거래처 원장을 불러오세요.</div>
        </div>
    </section>
</main>

<script src="/js/ar-ledger.js?v=20260911-refund-settlement"></script>
</body>
</html>
