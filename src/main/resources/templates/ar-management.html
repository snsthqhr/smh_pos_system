<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼화페인트 미수금 관리</title>
    <link rel="stylesheet" href="/css/app-ui.css">
</head>
<body class="app-shell management-screen">
<aside class="management-nav">
    <div class="brand-mark vertical">
        <strong>SP SAMHWA</strong>
        <span>미수금 관리</span>
    </div>
    <nav aria-label="관리 메뉴">
        <a href="/sales-management">판매내역 관리</a>
        <a href="/ar-management">거래처 미수현황</a>
        <a href="#">거래처 매출현황</a>
        <a href="#">거래처 매출원장</a>
        <a href="#">거래명세표 출력</a>
        <a class="is-active" href="/ar-management">미수금 관리</a>
        <a href="#">고객 관리</a>
        <a href="#">상품 관리</a>
        <a href="/pos">POS 판매 화면</a>
    </nav>
</aside>

<main class="management-layout ar-layout">
    <header class="management-header">
        <div>
            <p>AR01. 미수금 / 수금 관리</p>
            <h1>미수금 관리</h1>
        </div>
        <div class="header-actions">
            <a href="/sales-management">판매내역</a>
            <a href="/pos">POS 판매</a>
        </div>
    </header>

    <section class="ar-customer-band" aria-label="고객 미수금 조회">
        <label class="management-customer-search">
            고객명
            <input type="search" data-ar-customer-search autocomplete="off">
            <button type="button" class="customer-clear" data-ar-customer-clear hidden>해제</button>
            <div class="customer-results management-customer-results" data-ar-customer-results hidden></div>
        </label>
        <label>
            시작일
            <input type="date" data-ar-start-date>
        </label>
        <label>
            종료일
            <input type="date" data-ar-end-date>
        </label>
        <button type="button" data-search-ar>조회</button>
        <div class="ar-balance-card">
            <span>현재 미수금</span>
            <strong data-ar-current-balance>0</strong>
        </div>
        <button type="button" class="primary-action" data-open-payment-modal>수금 등록</button>
        <p class="management-message" data-ar-message></p>
    </section>

    <section class="history-table ar-payment-history-table" aria-label="수금 이력">
        <div class="table-header">
            <span>수금일자</span>
            <span>고객명</span>
            <span>연결전표</span>
            <span>수금액</span>
            <span>수금 후 잔액</span>
            <span>메모</span>
        </div>
        <div class="ar-payment-history-rows" data-ar-payment-history-rows>
            <div class="empty-table-state">수금 이력이 이곳에 표시됩니다.</div>
        </div>
    </section>
</main>

<div class="modal-backdrop" data-payment-modal hidden>
    <section class="payment-modal" role="dialog" aria-modal="true" aria-labelledby="paymentModalTitle">
        <header class="modal-header">
            <div>
                <p>AR02. 수금 등록</p>
                <h2 id="paymentModalTitle">수금 등록</h2>
            </div>
            <button type="button" class="icon-close" data-close-payment-modal aria-label="닫기">×</button>
        </header>
        <div class="payment-modal-body">
            <div class="payment-target-card">
                <span>선택 고객</span>
                <strong data-payment-customer-label>고객을 선택하세요.</strong>
            </div>
            <label class="payment-customer-picker wide">
                고객명
                <input type="search" data-payment-customer-search autocomplete="off" placeholder="수금할 고객 검색">
                <div class="customer-results payment-customer-results" data-payment-customer-results hidden></div>
            </label>
            <label>
                연결전표
                <select data-payment-sales-order>
                    <option value="">고객 전체 수금</option>
                </select>
            </label>
            <label>
                수금액
                <input type="number" min="1" data-payment-amount>
            </label>
            <div class="payment-due-card">
                <span data-payment-due-label>선택 기준 미수금</span>
                <strong data-payment-due-amount>0</strong>
            </div>
            <label>
                수금방식
                <select data-payment-method>
                    <option value="CASH">현금</option>
                    <option value="CARD">카드</option>
                    <option value="TRANSFER">통장입금</option>
                </select>
            </label>
            <label class="wide">
                메모
                <input data-payment-memo placeholder="수금 메모">
            </label>
            <p class="management-message" data-payment-message></p>
        </div>
        <footer class="modal-footer">
            <button type="button" data-clear-sales-order disabled>전표해제</button>
            <div class="modal-footer-actions">
                <button type="button" data-close-payment-modal>취소</button>
                <button type="button" class="primary-action" data-register-payment disabled>수금 저장</button>
            </div>
        </footer>
    </section>
</div>

<script src="/js/ar-management.js"></script>
</body>
</html>
